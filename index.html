<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Eric's Watchlist Brief</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered 640px column; navy header band; tables scroll inside their own box on phones */
:root{
  --bg:#eef1f5; --card:#ffffff; --fg:#0f172a; --muted:#64748b; --faint:#94a3b8; --line:#e2e8f0;
  --head:#0f172a; --head-fg:#ffffff; --head-sub:#cbd5e1;
  --up:#15803d; --down:#b91c1c; --flat:#64748b;
  --up-bg:#f0fdf4; --down-bg:#fef2f2; --tile:#f8fafc; --link:#0f172a;
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1120; --card:#131c2e; --fg:#e2e8f0; --muted:#94a3b8; --faint:#64748b; --line:#1f2a3d;
  --head:#020617; --head-fg:#f8fafc; --head-sub:#94a3b8;
  --up:#4ade80; --down:#f87171; --flat:#94a3b8;
  --up-bg:#0f2a1c; --down-bg:#2d1416; --tile:#0f172a; --link:#e2e8f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1120; --card:#131c2e; --fg:#e2e8f0; --muted:#94a3b8; --faint:#64748b; --line:#1f2a3d;
  --head:#020617; --head-fg:#f8fafc; --head-sub:#94a3b8;
  --up:#4ade80; --down:#f87171; --flat:#94a3b8;
  --up-bg:#0f2a1c; --down-bg:#2d1416; --tile:#0f172a; --link:#e2e8f0; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.wrap{max-width:640px;margin:0 auto;background:var(--card);border-radius:10px;overflow:hidden}
header{background:var(--head);color:var(--head-fg);padding:20px}
header h1{margin:0;font-size:20px;font-weight:700;text-wrap:balance}
header .sub{color:var(--head-sub);font-size:13px;margin-top:4px}
section{padding:16px 20px 4px}
h2{font-size:15px;margin:0 0 8px;font-weight:700}
h2 small{font-weight:400;color:var(--muted);font-size:12px}
.headline{font-size:16px;font-weight:700;margin:0;text-wrap:balance}
.ctx{font-size:12px;color:var(--muted);margin-top:8px}
a{color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.ctx a,.note a{color:var(--muted);font-weight:500}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child,th:first-child{border-left:3px solid transparent}
.num{text-align:right;white-space:nowrap}
.why{font-size:12px;color:var(--fg)} .quiet{color:var(--faint)}
tr.hi-up{background:var(--up-bg)} tr.hi-up td:first-child{border-left-color:var(--up)}
tr.hi-down{background:var(--down-bg)} tr.hi-down td:first-child{border-left-color:var(--down)}
tr.hi-up .num:nth-child(3),tr.hi-down .num:nth-child(3){font-weight:600}
.note{font-size:12px;color:var(--muted);padding:6px 8px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.tile{background:var(--tile);border:1px solid var(--line);border-radius:8px;padding:12px}
.tile .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tile .val{font-size:22px;font-weight:700;margin-top:4px}
.tile .val.sm{font-size:16px}
.tile .chg{font-size:13px}
.tile .chg.muted{color:var(--muted);font-size:12px}
.prose{font-size:13px;color:var(--fg);margin:10px 0 0}
footer{padding:16px 20px 20px;margin-top:16px;border-top:1px solid var(--line);font-size:11px;color:var(--faint)}
</style>
<style>.msg{padding:40px 20px;text-align:center;color:var(--muted);font-size:14px}
.nav{max-width:640px;margin:0 auto 10px;display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted)}
.nav a{font-weight:500}
.nav select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:60%}
.nav .old{color:var(--down);font-weight:600}</style>
</head>
<body>
<div class="nav" id="nav" hidden><span id="navinfo"></span><select id="pick" aria-label="Earlier briefs"></select></div>
<div class="wrap" id="brief"><div class="msg">Loading your brief.</div></div>
<script>
(function(){
  var BASE = "https://dqwjljkfjrivcilkagrl.supabase.co/rest/v1/rpc/";
  var KEY = "sb_publishable_X8MJ4siG11LARe0RfMnWNw_cfOIb3Lg";
  var box = document.getElementById("brief");
  var token = (location.hash || "").replace(/^#/, "");
  var slug = new URLSearchParams(location.search).get("d") || "";
  function msg(t){ box.innerHTML = '<div class="msg"></div>'; box.firstChild.textContent = t; }
  function rpc(name, body){
    return fetch(BASE + name, {method:"POST", headers:{"apikey":KEY,"Content-Type":"application/json"}, body:JSON.stringify(body), cache:"no-store"})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
  }
  function label(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})-(\w+)$/.exec(s); if(!m) return s;
    var d = new Date(Date.UTC(+m[1], +m[2]-1, +m[3], 12));
    var day = d.toLocaleDateString("en-US",{weekday:"short", month:"short", day:"numeric", year:"numeric", timeZone:"UTC"});
    var k = m[4] === "midmorning" ? "Midmorning" : m[4] === "close" ? "Close" : m[4];
    return day + ", " + k;
  }
  function linkFor(s){ return location.pathname + (s ? "?d=" + encodeURIComponent(s) : "") + "#" + token; }
  if(!token){ msg("This link is missing its key. Open the link from your email."); return; }
  rpc("get_watchlist_brief_at", {p_token: token, p_slug: slug || null})
    .then(function(rows){
      if(!rows || !rows.length){ msg(slug ? "No brief found for " + label(slug) + "." : "No brief found for this link."); return null; }
      var row = rows[0];
      box.innerHTML = row.html;
      var links = box.querySelectorAll("a[href]");
      for(var i=0;i<links.length;i++){ links[i].target="_blank"; links[i].rel="noopener noreferrer"; }
      return row.slug;
    })
    .catch(function(){ msg("Could not load the brief. Try again in a minute."); return null; })
    .then(function(current){
      return rpc("list_watchlist_briefs", {p_token: token}).then(function(list){
        if(!list || !list.length) return;
        var nav = document.getElementById("nav"), info = document.getElementById("navinfo"), pick = document.getElementById("pick");
        var newest = list[0].slug;
        if(current && current !== newest){
          info.innerHTML = '<span class="old">Older brief</span> &middot; <a href="' + linkFor("") + '">Go to latest</a>';
        } else {
          info.textContent = "Latest brief";
        }
        for(var i=0;i<list.length;i++){
          var o = document.createElement("option");
          o.value = list[i].slug; o.textContent = label(list[i].slug);
          if(list[i].slug === current) o.selected = true;
          pick.appendChild(o);
        }
        pick.onchange = function(){ location.href = linkFor(pick.value); };
        window.onhashchange = null;
        nav.hidden = false;
      });
    })
    .catch(function(){});
})();
</script>
</body>
</html>
